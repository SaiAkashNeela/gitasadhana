services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "5001"
      NODE_ENV: ${NODE_ENV:-development}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      EMAIL_FROM: ${EMAIL_FROM:-hello@mails.gitasadhana.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hello@gitasadhana.com}
      MAILDEV_HOST: maildev
      MAILDEV_PORT: "1025"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-2.5-flash}
      APP_URL: ${APP_URL:-https://gitasadhana.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,capacitor://localhost,http://localhost}
    ports:
      - "5001:5001"
    depends_on:
      - maildev

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5001}
      VITE_GOOGLE_WEB_CLIENT_ID: ${VITE_GOOGLE_WEB_CLIENT_ID:-}
      VITE_GOOGLE_IOS_CLIENT_ID: ${VITE_GOOGLE_IOS_CLIENT_ID:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_APPLE_CLIENT_ID: ${VITE_APPLE_CLIENT_ID:-}
      VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  maildev:
    image: maildev/maildev:2.1.0
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  frontend_node_modules:
