services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "5001"
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      EMAIL_FROM: ${EMAIL_FROM:-hello@mails.gitasadhana.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-hello@gitasadhana.com}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-2.5-flash}
      APP_URL: ${APP_URL:-https://gitasadhana.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
